name: Narendra AppLock APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    name: Build Debug & Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Prepare Debug Keystore
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storetype JKS \
                -alias androiddebugkey \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -storepass android \
                -keypass android \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Run Unit & Robolectric Tests
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew :app:testDebugUnitTest
          else
            gradle :app:testDebugUnitTest
          fi

      - name: Build Debug APK
        run: |
          if [ -f ./gradlew ]; then
            ./gradlew :app:assembleDebug
          else
            gradle :app:assembleDebug
          fi

      - name: Prepare Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD_SECRET: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD_SECRET: ${{ secrets.KEY_PASSWORD }}
        run: |
          STORE_PASS="${STORE_PASSWORD_SECRET:-narendra_ci_upload_pass}"
          KEY_PASS="${KEY_PASSWORD_SECRET:-$STORE_PASS}"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
          else
            rm -f my-upload-key.jks
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -storetype PKCS12 \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PASS" \
              -keypass "$STORE_PASS" \
              -dname "CN=Narendra Maurya, OU=Security, O=NarendraAppLock, L=Gorakhpur, S=UP, C=IN"
          fi

      - name: Build Release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD_SECRET: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD_SECRET: ${{ secrets.KEY_PASSWORD }}
        run: |
          export KEYSTORE_PATH="${GITHUB_WORKSPACE}/my-upload-key.jks"
          export STORE_PASSWORD="${STORE_PASSWORD_SECRET:-narendra_ci_upload_pass}"
          if [ -n "$KEYSTORE_BASE64" ]; then
            export KEY_PASSWORD="${KEY_PASSWORD_SECRET:-$STORE_PASSWORD}"
          else
            export KEY_PASSWORD="$STORE_PASSWORD"
          fi
          if [ -f ./gradlew ]; then
            ./gradlew :app:assembleRelease
          else
            gradle :app:assembleRelease
          fi

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Narendra-AppLock-Debug-APK
          path: '**/app/build/outputs/apk/debug/*.apk'
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Narendra-AppLock-Release-APK
          path: '**/app/build/outputs/apk/release/*.apk'
          if-no-files-found: error
